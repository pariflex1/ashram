<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Contact Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f4f4f4;
      padding: 20px;
      text-align: center;
    }

    .logo {
      max-width: 150px;
      margin: 0 auto 30px;
      animation: fadeIn 1s ease-out;
    }

    .logo img {
      width: 100%;
      border-radius: 10px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 400px;
      margin: 0 auto;
    }

    .buttons a {
      display: block;
      padding: 14px;
      background: #ffffff;
      color: #333;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: 0.3s;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s ease forwards;
    }

    .buttons a:nth-child(1) { animation-delay: 0.2s; }
    .buttons a:nth-child(2) { animation-delay: 0.4s; }
    .buttons a:nth-child(3) { animation-delay: 0.6s; }
    .buttons a:nth-child(4) { animation-delay: 0.8s; }
    .buttons a:nth-child(5) { animation-delay: 1s; }

    .buttons a:hover {
      background: #e0e0e0;
      transform: translateY(-2px);
    }

    .buttons a span {
      margin-right: 8px;
    }

    @media (min-width: 600px) {
      .buttons {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }

      .buttons a {
        flex: 1 1 45%;
      }
    }

    /* Animations */
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <!-- Logo Section -->
  <div class="logo">
    <img src="https://via.placeholder.com/150x80?text=Your+Logo" alt="Logo">
  </div>

  <!-- Button Links -->
  <div class="buttons">
    <a href="https://goo.gl/maps/xyz123" target="_blank"><span>📍</span>Google Map</a>
    <a href="https://instagram.com/yourprofile" target="_blank"><span>📸</span>Instagram</a>
    <a href="https://wa.me/919876543210" target="_blank"><span>💬</span>WhatsApp</a>
    <a href="tel:+919876543210"><span>📞</span>Call Us</a>
    <a href="mailto:example@email.com"><span>✉️</span>Email Us</a>
  </div>

</body>
</html>
