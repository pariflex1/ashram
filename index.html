<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Krishna Anandam Ashram</title>
  <meta name="description" content="Contact Details of Krishna Anandam Ashram, Vrindavan, Mathura" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta property="og:title" content="Contact Details of Krishna Anandam Ashram" />
  <meta property="og:description" content="Vrindavan, Mathura" />
  <meta property="og:image" content="https://github.com/pariflex1/ashram/blob/gh-pages/Images/og.webp?raw=true" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      background: #f4f4f4;
      padding: 24px 16px 40px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
    }

    .logo {
      max-width: 160px;
      width: 100%;
      margin: 20px auto 30px;
      animation: fadeIn 1s ease-out;
    }

    .logo img {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 400px;
    }

    .buttons a {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 16px;
      background: #ffffff;
      color: #333;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transition: 0.3s ease;
      font-size: 16px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s ease forwards;
    }

    .buttons a:hover {
      background: #eaeaea;
      transform: translateY(-1px);
    }

    .buttons a span {
      margin-right: 10px;
      font-size: 18px;
    }

    .buttons a:nth-child(1) { animation-delay: 0.2s; }
    .buttons a:nth-child(2) { animation-delay: 0.4s; }
    .buttons a:nth-child(3) { animation-delay: 0.6s; }
    .buttons a:nth-child(4) { animation-delay: 0.8s; }
    .buttons a:nth-child(5) { animation-delay: 1s; }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 360px) {
      .buttons a {
        font-size: 15px;
        padding: 12px 14px;
      }

      .buttons a span {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="logo">
    <img src="https://github.com/pariflex1/ashram/blob/gh-pages/Images/1.webp?raw=true" alt="Krishna Anandam Ashram Logo">
  </div>

  <div class="buttons">
    <a href="https://maps.app.goo.gl/CQPwvBbvYdQ45zaR9?g_st=com.google.maps.preview.copy" target="_blank">
      <span>📍</span>Google Map
    </a>
    <a href="https://www.instagram.com/krishnaanandam_vrindavan/" target="_blank">
      <span>📸</span>Instagram
    </a>
    <a href="https://api.whatsapp.com/send?phone=+919129054406&text=Hi,%20I%20want%20to%20know%20more%20about%20Krishna%20Anandam%20Ashram" target="_blank">
      <span>💬</span>WhatsApp
    </a>
    <a href="tel:+919129054406">
      <span>📞</span>Call Us
    </a>
    <a href="mailto:ashram@krishnaanandam.com">
      <span>✉️</span>Email Us
    </a>
  </div>

</body>
</html>
