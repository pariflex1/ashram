<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
<title>Krishna Anandam Ashram</title>
<meta name="Krishna Anandam Ashram" />
<meta property="og:title" content="Contact Details of Krishna Anandam Ashram" />
<meta property="og:description" content="Vrindavan, Mathura" />
<meta property="og:image" content="https://github.com/pariflex1/ashram/blob/gh-pages/Images/og.webp?raw=true" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      background: #f4f4f4;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo {
      max-width: 150px;
      margin: 0 auto 30px;
      animation: fadeIn 1s ease-out;
    }

    .logo img {
      width: 100%;
      border-radius: 10px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 400px;
      margin: 0 auto;
    }

    .buttons a {
      display: block;
      padding: 14px;
      background: #ffffff;
      color: #333;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: 0.3s;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s ease forwards;
    }

    .buttons a:hover {
      background: #e0e0e0;
      transform: translateY(-2px);
    }

    .buttons a span {
      margin-right: 8px;
    }

    .buttons a:nth-child(1) { animation-delay: 0.2s; }
    .buttons a:nth-child(2) { animation-delay: 0.4s; }
    .buttons a:nth-child(3) { animation-delay: 0.6s; }
    .buttons a:nth-child(4) { animation-delay: 0.8s; }
    .buttons a:nth-child(5) { animation-delay: 1s; }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (min-width: 600px) {
      .buttons {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }

      .buttons a {
        flex: 1 1 45%;
      }
    }
  </style>
</head>
<body>

  <div class="logo">
    <img src="https://github.com/pariflex1/ashram/blob/gh-pages/Images/1.webp?raw=true" alt="Logo">
  </div>

  <div class="buttons">

    <a href="mailto:ashram@krishnaanandam.com"><span>✉️</span>Email Us</a>
  </div>

</body>
